<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="760" viewBox="0 0 1560 760" role="img" aria-label="网关架构" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Inter',sans-serif">
  <defs>
    <marker id="m334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="m0D9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/></marker>
    <marker id="m64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
    <style>
      text{font-synthesis:none;}
      .tt{font-size:14px;font-weight:700;fill:#0F172A;}
      .ts{font-size:10px;font-weight:500;fill:#64748B;}
      .t{font-size:13px;font-weight:700;fill:#0F172A;}
      .b{font-size:11.5px;font-weight:500;fill:#64748B;}
      .s{font-size:10.5px;font-weight:500;fill:#64748B;}
      .lab{font-size:11px;font-weight:600;fill:#334155;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4px;stroke-linejoin:round;}
      .lab-t{font-size:11px;font-weight:600;fill:#0D9488;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4px;stroke-linejoin:round;}
      .lab-g{font-size:11px;font-weight:600;fill:#64748B;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4px;stroke-linejoin:round;}
    </style>
  </defs>

  <rect width="1560" height="760" fill="#FFFFFF"/>

  <!-- 分区带 -->
  <rect x="36" y="36" width="300" height="470" rx="13" fill="#EEF0FF" stroke="#C7D2FE" stroke-width="1.3"/>
  <rect x="52" y="50" width="4" height="15" rx="2" fill="#4F46E5"/>
  <text x="66" y="62" class="tt">① 接入</text>
  <text x="66" y="79" class="ts">调用方声明会话与策略</text>

  <rect x="356" y="36" width="560" height="470" rx="13" fill="#F6F2FE" stroke="#DDD0F5" stroke-width="1.3"/>
  <rect x="372" y="50" width="4" height="15" rx="2" fill="#7C3AED"/>
  <text x="386" y="62" class="tt">② 网关进程</text>
  <text x="386" y="79" class="ts">接入 · 透传 · 路由 · 摘除</text>

  <rect x="936" y="36" width="588" height="470" rx="13" fill="#FFF5EC" stroke="#F6D2B3" stroke-width="1.3"/>
  <rect x="952" y="50" width="4" height="15" rx="2" fill="#EA580C"/>
  <text x="966" y="62" class="tt">③ 上游副本</text>
  <text x="966" y="79" class="ts">sticky 命中 · 摘除与恢复</text>

  <rect x="36" y="530" width="1488" height="200" rx="13" fill="#F0F5FE" stroke="#BFDBFE" stroke-width="1.3"/>
  <rect x="52" y="544" width="4" height="15" rx="2" fill="#2563EB"/>
  <text x="66" y="556" class="tt">④ 记录与部署</text>
  <text x="1508" y="556" class="ts" text-anchor="end">事件落账本 · 单二进制交付</text>

  <!-- 调用方 -->
  <g>
    <rect x="80" y="145" width="212" height="150" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.2"/>
    <text x="96" y="171" class="t">调用方 / 应用</text>
    <text x="96" y="197" class="b">请求体 session_id</text>
    <text x="96" y="219" class="b">或 header X-Session-ID</text>
    <text x="96" y="241" class="b">策略 kvferry_policy</text>
    <text x="96" y="269" class="s">pin · must_fetch · release</text>
  </g>

  <!-- 网关进程框 -->
  <rect x="380" y="110" width="512" height="380" rx="12" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="6 5" opacity="0.45"/>
  <text x="394" y="124" font-size="10" font-weight="500" fill="#7C3AED">网关进程 · 单实例</text>

  <g>
    <rect x="396" y="150" width="222" height="140" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="412" y="176" class="t">会话与策略透传</text>
    <text x="412" y="202" class="b">只透传 · 不生成不改写</text>
    <text x="412" y="224" class="b">无编号按独立请求</text>
    <text x="412" y="246" class="b">不解释策略语义</text>
    <text x="412" y="268" class="s">策略随会话编号透传</text>
  </g>
  <g>
    <rect x="654" y="150" width="222" height="140" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="670" y="176" class="t">会话粘性路由</text>
    <text x="670" y="202" class="b">会话映射在进程内</text>
    <text x="670" y="224" class="b">同会话发往同一副本</text>
    <text x="670" y="246" class="b">重启按下一请求重新粘</text>
    <text x="670" y="268" class="s">摘除时会话改粘目标副本</text>
  </g>
  <g>
    <rect x="396" y="330" width="222" height="140" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="412" y="356" class="t">探针与摘除</text>
    <text x="412" y="382" class="b">按周期探测健康端点</text>
    <text x="412" y="404" class="b">连续失败达阈值摘除</text>
    <text x="412" y="426" class="b">检测延迟 = 周期 × 阈值</text>
    <text x="412" y="448" class="s">只按探针结果摘除</text>
  </g>
  <g>
    <rect x="654" y="330" width="222" height="140" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="670" y="356" class="t">摘除与改路</text>
    <text x="670" y="382" class="b">在飞请求带原 request id</text>
    <text x="670" y="404" class="b">改路只执行一次</text>
    <text x="670" y="426" class="b">全副本摘除快速失败</text>
    <text x="670" y="448" class="s">不静默挂起</text>
  </g>

  <!-- 上游副本框 -->
  <rect x="960" y="110" width="540" height="380" rx="12" fill="none" stroke="#EA580C" stroke-width="1" stroke-dasharray="6 5" opacity="0.45"/>
  <text x="974" y="124" font-size="10" font-weight="500" fill="#EA580C">引擎副本 ×N</text>

  <g>
    <rect x="976" y="150" width="250" height="140" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2"/>
    <text x="992" y="176" class="t">引擎副本</text>
    <text x="992" y="202" class="b">sticky 命中会话</text>
    <text x="992" y="224" class="b">前缀缓存副内积累</text>
    <text x="992" y="246" class="b">探针判定健康</text>
    <text x="992" y="268" class="s">/health 健康端点</text>
  </g>
  <g>
    <rect x="1250" y="150" width="250" height="140" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="1266" y="176" class="t">已摘除副本</text>
    <text x="1266" y="202" class="b">探针连续失败判定</text>
    <text x="1266" y="224" class="b">在飞请求已改路</text>
    <text x="1266" y="246" class="b">会话改粘其余副本</text>
    <text x="1266" y="268" class="s">恢复后重新纳入</text>
  </g>
  <g>
    <rect x="976" y="330" width="508" height="140" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2"/>
    <text x="992" y="356" class="t">滚动升级中的副本</text>
    <text x="992" y="382" class="b">副本逐台升级</text>
    <text x="992" y="404" class="b">升级中按探针结果摘除</text>
    <text x="992" y="426" class="b">完成后重新纳入</text>
    <text x="1240" y="382" class="b">在飞请求改路继续计算</text>
    <text x="1240" y="404" class="b">逐台升级不中断其余副本</text>
    <text x="1240" y="426" class="b">由 k8s 清单负责滚动升级</text>
  </g>

  <!-- 主链箭头 -->
  <g fill="none" stroke="#334155" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M294,220 L390,220" marker-end="url(#m334155)"/>
    <path d="M624,220 L648,220" marker-end="url(#m334155)"/>
    <path d="M882,220 L968,220" marker-end="url(#m334155)"/>
    <path d="M882,390 L930,390 L930,310" marker-end="url(#m334155)" stroke-width="1.4"/>
  </g>
  <text x="341" y="208" class="lab" text-anchor="middle">请求 · 会话头</text>
  <text x="636" y="208" class="lab" text-anchor="middle">会话编号</text>
  <text x="925" y="208" class="lab" text-anchor="middle">sticky 路由</text>
  <text x="918" y="352" class="lab" text-anchor="middle">在飞请求改路</text>

  <!-- 探测线 -->
  <path d="M390,390 L366,390 L366,95 L1250,95 L1250,156" fill="none" stroke="#64748B" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m64748B)"/>
  <text x="900" y="83" class="lab-g" text-anchor="middle">周期探测 /health</text>

  <!-- 事件写入 -->
  <g fill="none" stroke="#0D9488" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
    <path d="M508,476 L508,521 L180,521 L180,570" marker-end="url(#m0D9488)"/>
    <path d="M740,476 L740,521 L480,521 L480,570" marker-end="url(#m0D9488)"/>
  </g>
  <text x="514" y="497" class="lab-t">摘除事件</text>
  <text x="610" y="511" class="lab-t" text-anchor="middle">改路事件</text>

  <!-- 记录与部署 -->
  <g>
    <rect x="60" y="576" width="460" height="140" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/>
    <text x="76" y="602" class="t">演练记录</text>
    <text x="76" y="630" class="b">记摘除与改路事件</text>
    <text x="76" y="654" class="b">字段：时刻 · 节点编号 · 手段</text>
    <text x="76" y="678" class="b">命中率曲线等由使用方补齐</text>
  </g>
  <g>
    <rect x="540" y="576" width="960" height="140" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="556" y="602" class="t">部署形态</text>
    <text x="556" y="630" class="b">Go 单二进制 · 单实例部署</text>
    <text x="556" y="654" class="b">显式配置：监听端口 · 副本列表</text>
    <text x="556" y="678" class="b">探针周期 · 失败阈值</text>
    <text x="1050" y="630" class="b">单机进程脚本拉起</text>
    <text x="1050" y="654" class="b">集群由 k8s 清单拉起</text>
    <text x="1050" y="678" class="b">副本逐台升级按摘除处理</text>
  </g>
</svg>