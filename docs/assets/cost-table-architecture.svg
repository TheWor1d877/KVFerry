<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="780" viewBox="0 0 1560 780" role="img" aria-label="KVFerry 代价表总览" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Inter',sans-serif">
  <defs>
